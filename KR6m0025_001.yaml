body:
  text: 此言相者即目名相非是名外別有體相也亦可計相也二修觀行者下結勸悟入上來依比量思擇所成智悟入性空自下第二依修習力悟入性空初此是登地已上以此論下文地前雖有有漏修慧以判為聞思慧地上斷惑判為修慧下卷具明就明雖依思擇智力悟入修習力智用喻如鳥翅羽初生比知於虗空未能思擇之智雖比知諸法性空未能親證亦復如是勤下第二正明依修習力證法性空文中又二初明依力正證性空二如是正修下由悟空性類知無生乃中又二初明依修證於性空二如世尊下引説證成前四一法二喻三合四結初言故復精勤習修習力者説謂於地前雖思擇智力比知性空未依地修習無漏證證法性空故今於世第法中一習三道登初地修真觀行初現前時證法性空故言故習修習力也二如眩醫者下喻況謂地前凡夫為有相別所盲如無目入暗則無所見故言如眩醫者餌能翳藥故眼淨清淨離諸蚊蠅等明見境界者謂真觀藥故能遣遍計所執及依他等性慧眼戲論等執明見性空也下合喻勤習者合得餌能遣除眩醫遣執取有為耶智正合前所遣眩醫之病修真觀行初現前時不由他緣受妙喜樂合前眼得清淨不由他緣受妙喜樂由眼餌等緣而受身心遍滿喜樂也此正是證初取一切有為相故下合前離諸粗大蠅等也常修大合前明見境界也前中有二初總明不取一切有為取一切施下次明取取中有三初明不妄取二下明不妄求三不下明不妄執前不妄取中初明不輪二乃能下明不取二嚴前三輪中有二初約施因以輪二通約施果以明三輪初言不取施物謂達諸法空施者受者達補特伽羅空皆謂當施時不取也二者還明數取趣空及施果報亦是法空果報有二在恭敬供養二是當來依正兩果不取施者謂達當果者體空受者謂達當能受報體空施在恭敬供養體空二種三輪得清淨者離言清淨也二乃能正勤下明不取二嚴由得三輪體空亡於彼我故能精勤攝受無量福智資糧擔此二在因為資糧至果名菩提以三身為體宗為尊重荷負終能得果故名重擔猶是經云是人能荷阿耨多羅三藐三菩提也二終不下明不妄求文中二初明不妄貪求三界有漏現未果二亦不下明不漏現未果故妄行其因三亦不妄執下明不妄執言德作者者此是僧佉計苦樂癡等三德為造作之者供我我為受者受德所供也言我為作者者此是吠世師計我是作者亦是受者故言我為作者或有外道計大天能造作一切計極微常劫壞之時散在虗空時和合能作一切也性謂世性謂一切法各有體來起入現在復從現在流入過去二常修大捨下境果謂達法不二證空平等無法可取故言常修如是等事下結證所由謂由三世諸佛所説正理或次第修證得悟有為無為所破能破一切性空謂過現佛當説謂未來佛如世尊下第二引説證成三經一言菩薩不應安住諸事行於布施者謂行施達一切空故不住自身而行布施都無所住行於布達一切空故不住報思果報而行布施此經通明人法空又世尊言若諸菩薩有情想轉不應説名真實菩薩者有情者舊翻名衆生轉者起也謂有菩薩於諸有情起心計有衆生不應説此菩薩名為不顛倒真實有智慧此經但明補特伽羅空三又世尊言無有小法名能菩薩乘者謂菩薩知諸行如一切諸法同一空如於空如中何有少行法是其能趣乘為所趣也下舉勝況劣空菩提生死悉皆平等故無所欣厭也此經唯明法空皆證初地已上修慧之行故知修慧唯在地上上來明依力正證性空自下第二類悟諸法無生乃至平等文明依性空悟法無生二如有問下引説證成前中初後二無生既無三世又無三世無故即前施等三輪清淨趣大菩是正修有為性空觀已是結前復應正觀若自性空無有生是生後若諸法從本已來自體既空空中何法可生故言即無有生也二以無生即無三世夫三世法必有始生終滅今既平等皆空空無有生生法既無何三世何得故言即無過去未來現在既平等皆空則三世差別故言於三世無有礙以正觀三世皆離有無取執之垢故言皆清淨相三依前所説無顛倒二空之理施等三輪清淨之行趣大菩提此以無趣為趣亦以無假名菩提也自下第二引説證成如有問曼殊室利菩薩趣大菩提此問修能趣菩提因行之相答言梵菩提此是曼殊室利答謂能達趣修之行體如果如平等平等無有差別如是菩薩真能趣大菩提此趣假名趣也復問云何名菩提此問菩提果相答言非未來現在謂由諸法皆空無性無性故無生無性故無生何三世菩提之體亦復如是無性無生及無三世等同法是菩提相是故下結勸修學謂是彼因果平等如相無別菩薩修行趣菩提應觀三世皆悉清淨無有生滅垢相修施等行時達二空真如行三輪淨行以如是無行無趣無菩提假名為行為趣為菩提是真菩薩上來第一明依勝義諦理造此略論令修行者依聞等三慧悟入一切有為諸法自性皆空自下第二依勝義諦理造此略論令修行者聞等三慧悟入一切無為諸法自性皆空文中有二初觀行者依聞思所成智正比量力悟入無為性空二雖成智階梯力已悟入性空闕勝修力未能永斷所應除故復精勤習勝修力下明依修所成慧正入無為性空中又三初總明依聞思所成智正比量力悟入無為二毗婆沙師咸作此難下別明依聞思所成智正比量入自他所執無為性空三如是遣除諸過難下總結勸就初總中有三一結前起後謂如是乃至有為性空是結前而未悟入無為性空是起後二乘前生後明須開之意文有二初云若不開示乃至終不得成明不開之失二為開示故下明為益開宗言無為無有實不起似空華無為是法無有實是法法及有法不相離名宗不起是立因似華是同法喻三此中不明依宗釋頌文中有五初明須依宗意二就真性故下正明依宗釋頌三不説遮止下釋無不同異品喻意四云何此中下建立比量五此所立下明攝因周盡就須依宗意中文二初正出所依宗謂是真性故云中簡別立宗言詞即上真性二明須簡別意故言須簡意如前應知謂依世俗學所共知無為是有若對世俗説為是空便典現量世間自教等相違為是義故今言無為空者依勝義諦真性理中辨無為空也如前上卷已明應知自下第二依宗釋頌文中又二初正明就真性宗立無為是空非説世俗説無為空也二非有為故下正釋頌文中有三初釋立宗二即此下釋立因三空花無實下釋同法喻就釋立宗中初釋有法次即此下次釋其法就釋無為法中有三初釋名謂非有為故説名無為此即翻對有為無為義謂不為生等四相所為故名無為又不為四緣所為名無為也二辨體謂即是虗空擇滅非擇滅及真如性謂前所辨十二處中所除法處無為一分也廣辨如前三明四無為中先須悟入虗空性空者有二義一謂易開示故以唯虗空無有質礙物世間共立名作虗空故二由於虗空之處既達其空用此虗空易知之宗以為其門可以悟入擇滅非擇及真如等空故言悟入所餘無為宗性上來解有法訖即此世間下次解於法謂即世間所供知虗空無為就真性空無有實是名立宗者上來所明有法及法結為立宗二即此所立下次釋立因謂即此所立虗空無為對就勝義諦真性理故無實虗空如此無實之理論主及歒論兩家之宗依世俗諦許此虗空無實畢竟無生不者無也起者生也又云不實畢竟無有生之自性可得今言不起者即由無生所以不起如不起之名本無有性但是假説而已故言或假立為不起法具此二義説名為因結是立因三空華下釋同品喻空華無實同彼虗空亦是不起法故立為同喻者結是同喻上來依宗釋頌訖自下第三釋無不同品喻意故言不説遮止異品立為不同法喻如前應知指同前卷釋前云為遮異品立異法喻異品無故遮義已成是故不説也自下第四建立比量云何此中建立比量者此是假問徵起謂就真性下者謂勝義諦宗而立比量也虗空是有法無實是法法及有法相離名宗以不起故名是立因諸不起者愚智同知其性無實猶如空花此是同法喻此所立因下第五明攝因周盡文中有二初法説次喻況法説中謂此所立因不起故者是略舉一因名相雖復略舉一因名體而意在攝一切同類因故言復有餘因謂所作故非能作故無滅壞故如是等因能遮破所説無為定有自性是故如應皆得為因如説下喻況如説汝當守掌此蘇勿令烏近為令所守之蘇無損汙故亦應遮彼貓鼠等類不令損汙此亦如是雖略舉一不起故因遮破無為定性當知亦攝非所作非能作無滅壞等因以此等因皆能破無為生等四自性故也此中無為為所獲起自性所作自性能作自性滅壞自性是所遮不起故非所作故非能作故無滅壞故是能遮蘇喻所護無為烏貓鼠等喻所遮起等四種自性能守蘇人喻不起等四因人雖是一對所遮烏等有四設能遮之方亦四如因名雖一對所隨遮自性有四故能遮因體亦四互舉此四所遮自性衆多能遮之因亦衆上來至此總明依聞思所成智正比量力悟入無為性空自下別明依聞思所成智正比量力悟入自他所報無為性空令破十六家執分之為二前破十一執破自佛法內計二修觀行下次有五執破外道計前中第一破毗婆沙師執中文有二初述外計二此若方便下論主對破前述外計中有三初牒論主宗述成無義故言若所立宗無為無實是無有義二舉空處等至證有破無故言空處等至即無所緣云何有言空處者即無色界中空處地也等至者即空處地定將入此定先於定前起空處地心於方便時緣虗空無為境若虗空無為無實便是無法等至則無所緣境定境既無云何得有等至定也第二難云然無障礙是虗空相者自述己解既實有無障礙是虗空相何得言無也中應立量證虗空是有準下論主牒文定有比量也第二此若方便下論主對破破中有四初破空處等至難二此就勝義下破第二無礙是虗空相難三又即由下重破初難四是故我先下結成己宗初中有二先牒外人立二種比量謂雙立二宗二因二同法喻言空處等至實有所緣者空處等至是有法謂是能緣之定實有所緣是法謂定所緣境即是虗空無為法法及有法不相離名宗此是一種丘宗或境界實有境界是有法實有是法法及有法不相離名宗此是一種立宗初以等至為有法宗下以虗空境為有法宗初以無為為法宗下以無為法為法宗是等至故下是立因此是初宗因謂證成法義前宗法以所緣無為宗為因以等至定為宗法因既有能緣定定有所緣境或是等至所緣境者是第二宗因前以無為境為宗法今還以等至所緣境為因如餘等至下明同法喻言如餘等至者是初同法喻謂如四靜慮及上三空定如餘等至所緣境皆悉是有空處等至所緣境何獨是無或如彼緣者是下同法喻謂如彼七等既是有空處等至所緣境何為明有止來明諸等至及等至所緣境至所緣境一切是有空處同彼故亦是有也二其餘等至下論主對破謂其餘七等至及彼七等至所緣境皆是有為故我上卷中明一切有為皆空則此七等及所緣境已辨性空訖則汝所引同法喻既性自空無同法喻過也此就勝義辨虗空相者破其第二無境礙是虗空相外人就勝義諦立虗空性是有相今論主牒之以破謂立比量破若就下約世俗諦明虗空無實宗因喻悉可解此下結非外人三又即下重牒外計以破文中有三初又即此我所説因者論主將牒外計與外人作過先自序己宗謂即由虗空無為之宗性空故所以前説因云不起我此宗因喻無邊故二汝言下次序外人先所立宗因喻故云汝言等至所緣境故因依因明論法二人相歒俱無有過則先立量者有決定相違過失故言因有決定相違過也良由外人立量云空處等至實有所緣是等至故如餘等至論主云虗空亦非實有以不起故猶如空華故是決定相違過也以外人先立量故過屬外人也四是故下論主結已宗成故云我先所立無為無有實不起故似空花是義成無障難故也自部他部下破第二執自謂大乘他謂小乘文中有二初序外計二此義唯下論主對破前序外計中文二初約牒論主宗因故言若就真性虗空無實以不起故二此言下與論主作過過有與論主作違宗過彼言論主無為無有實因云不起故名為無實我亦義準此言有為者皆應是實又虗空無為既生起定心故實有若是實有論主便有違有為無為無有實二宗過也三若言起者下與論主作因不遍同品有不成因過若言起者亦無有實是則不起之因有不遍同品過因性不成者謂起與不起俱無有實論主立因但言不起不遍於起過故言二此審定言下別答前因有不遍同品之過所以因不成因二此是義準下論主對破中初總明此是義準為相似過類似不成因過非真不成二過初答違宗過中謂汝應審定我言我正云諸不起此皆無有實非謂審定言諸無實者悉皆不起是故雖復能生起等至何廢無實故無有過二雖復勤勇下答因不遍同品有不成因過今舉因明論法言同品定有性即得成因是以勤勇無間所發之因雖不遍於同品亦許為因今雖不遍故亦無有過也有餘復言下破第三執文中有二初序外執就序外即執中有四初明空體是有以世間衆生皆共知虗空有故二明花亦有體嗢鉢羅等世間現見是有體故三空花二下雙結空花為有謂空花二種雖不同性和合相應然空花二事非無自體以各有體故四故花喻下結非論主謂空及花即各有體乃立為無實者是義不成二此難不然下論主對破文中有二初正破虗空二由此下類破釋滅前中有二初總非外人故言不然二此空花不為之解擇擇云此空花喻就第六轉依士訓擇者謂八轉聲中第六屬主聲也言八轉者第一名體聲謂分別諸法體第二名業聲謂所作業如破樹是業也第三名業具聲如手斧等第四名所為聲如破樹為造舍等第五名因緣聲如所從來處第六名屬主聲如言空花空為主花是所屬謂是空之花故名空花也第七名所依聲謂凡所作必有所依第八名呼聲謂直呼所前物而已若以男女非男非女三聲各具此八合成二十四轉依此八轉聲復有六種釋詞句謂持業依士等六種令若釋此空花依八轉聲釋是第六轉屬主聲即空為主花為屬謂即空之花故名空花依六句訓釋當依士釋謂此空之花故名空花此之二釋皆花即空非空外別有華此既非有故喻非無者謂此空華之喻既非有故我立空華喻得成故言非無也第二由此下類破擇滅等空也謂由空華之喻無體道理修觀行者準喻知法應正悟入虗空無為性空知虗空無為既其體空於擇滅非擇滅真如等無為性空道理亦當悟入上來正破虗空無為自下第四毗婆沙師下正破擇滅無為文中有三初明立難就立難中有二初明立難所由謂不忍遮破擇滅無為為二復作是難下正明設難就設難中與論主作違宗過有二種一約自教辨違謂汝大乘中佛説有擇滅能對治有為有大作用汝謗言無即有自教相違過二喜貪俱行下約果教辨違謂現世愛滅由滅此愛得涅槃果寂靜妙樂故若謗言無亦是自教相違過第二此中下論主對破先破違自教過文中有二初依俗諦釋通佛教二依勝義諦釋通自言前中又二初釋通經意二如佛説下引説證成初言此中所以佛説有擇滅無為者為令衆生於有為境生厭離於無為境起愛樂故就世俗説有擇滅涅槃寂靜微妙二如佛説下引説證成佛説化生有情者謂死蘊後生蘊前所受中蘊名化生有情以中蘊生唯化生故此言有情依世俗法於五蘊上假説名有情非實有有情也擇滅亦爾但依世諦假説為有我今依佛所説亦許此擇滅無為隨世俗有故無違宗過二依勝義諦釋通自言文中有二初依宗立理故言但就真性遮破擇滅也二故世尊言下引説證成文易解二亦無誹謗下破違果教過亦二初依俗諦釋通佛教二非就勝義下釋通自言前中初總明無有誹謗聖滅諦過以就世俗下釋無過所以二非就勝義下依勝義諦釋通自言文相可解三由此聖教下牒教及理結已無過有餘不善正理論下破第五執文中有二初序外難二此下論主對彼前中言無為無實無為既無則所立宗不成此是宗過謂有法不極成過所立既不成所依不起之因亦復不成此是因過謂所依不成過空華無故同法喻不成言有法不成者總宗因喻三不成此中皆由無為有法不成故我此中作有法不成難此難不然下論主對破先破立宗過中先明無為有法二不顯差別下次解外難言想施設力者謂擇等四種無為皆是依世俗假想施設力故有此四種也亦可想者名也謂依世俗假名説有此四也文中一一別釋四無為名結假立可解不顯差別下釋伏難難云論主若立無為為假我立無為為實則所立宗有不極成過故今釋云不顯差別由共許力總立為有法謂因明立有法之法不顯有法體相差別謂總約彼此有義邊立為有法我以無為為世俗有汝以無為為勝義有者雖真俗不同有義不異故準因明法名為共許力故總立為有法也上來解有法訖自下解法此中以無有實為法言差別遮遣非所共知立為宗法者論主依勝義諦無為無實外人依勝義諦無為是實然我無實之理非汝外人之所共知故言差別我今立無實之言遮遣汝有實之語故言遮遣非所共知立為宗法也不彼起下次破因過謂彼無為體性非是修起造作之法汝我二宗皆共了知故我立不起為因證彼無為無是故下結無宗因二過外人難無為有法既無則所依不起之因亦不立今明二宗共許無為為有法故所依不起之因亦有故今總結云無有立宗因過所説空華不次破同喻不成過所説空華雖無有事事者體也而是不起等法之有法無性性故者不起是因等者等取餘同類因法有法即無為此空華雖無實體而是因法所依之有法同喻何以故以無有實體性與無為同故由是能成所成立義無有法不成過失者舉喻功能顯喻無過謂由空華是能成彼所成立宗因有法義故無有宗因所依有法同喻不成過也毗婆沙下次破第六執文亦有二初序執情二此言下論主對破前中初總非不然二擇滅下立量證有擇滅實有是立宗道所緣故違煩惱故是立因非無實法下結成有義此言唯有下論主對破謂此道所緣及違煩惱之言唯有遮異品俞義本無同品喻義用此以證擇滅是有此義豈成如遮虗空下指同前破虗空下指中破毗婆沙師救擇滅義指前已破此中不應重執經部諸師下次破第七執文中有二初序外執二若此義下論主對破前中言經部師者謂一向執經不信阿毗達摩諸十八部中皆有此執今此所明謂根本經部師也此部宗中明三無為是無體法故今語論主云今論主立虗空皆非實有如是比量若對我宗便是立已成過也若此義下論主對破破中有二初辨二宗不同無立已成過二所立宗言下重自舉宗顯有無俱破前中我以有礙色等無處隨世俗法説為虗空體即是依世俗法虗空是有若望汝宗非立已成辨彼無故者謂汝宗中辨彼虗空若真若俗一向無故二所立宗言下重自舉宗顯有無俱破但以群生執有者多所以正破有性有性既離無亦不立以執有執無皆是邊見不順有無不二之理今此論宗離四句亡百非豈有有無之可得也銅鍱部師下破第八執文亦有二初序外執二有為自性下論主對破前中言銅鍱部者謂佛去世一百年後阿輸伽王損壞佛法時阿輸伽王弟出家得羅漢果當滅佛法時身居上坐恐佛法更立無法可得遂打銅鍱錐乃諸三藏送著師子國後阿輸伽王得信部之僧取銅鍱三藏以用流通因以名焉即是上座部彼宗立間隟色説名虗空虗空有二義一不為他礙二不礙於他虗空之色雖不礙他而為地礙故名有為汝論主所遣無為依世俗是有與我有為不異故立已成過二有為下論主對破言有為自性如前已遣故亦不然者論主云我言虗空有者依世俗假名説有無其定性汝言虗空色有者乃是定性之有故我所立非立己成過又汝執虗空色是有為自性如前卷已破訖故不更破毗婆沙師下第九破犢子部即正量部是以此部所許與毗婆沙師同故指同毗婆沙師破相應論師下第十破喻伽師文中有二初明相應師立計二實不應理下論主對破就初執中復三初相應師自立宗於勝義上更無執有定性勝義故名勝義空次將明真如即是勝義謂真如即是諸法勝義故就勝義説真如空即謂於真如上更無定性真如故説真如空也此言稱理者結己宗是二而言真如非實有者此不稱理下非論主所立三云何出世下自立道理證真如是有若道真如非實有者云何無分別智及後得智乃緣無法為境得是應於真正道理也後得智於真觀前後緣相智似真如故作此説二實不應理者下論主對破破中有二初論主總非言實不應理謂汝相應師所立之宗實不應於正理也二如説下正破破中有二初破非論主義二又汝所説下破其立義前中有三初正破二引説證成三憶持下牒以結非初中如汝所説此無分別智緣無法為境不應正理者何但緣無法為境不應正理緣有法為境亦不應理上來雖言緣有無境未智何法是所緣有境故今言非執真如實有為境得是應理以執真如為實有性難成立故此中偏破有性者以其自知緣無法為境不應道理所以偏破有病也何故難成立故以緣真如智非真出世無分別智此是立宗以有所緣故下立因謂若智外有所緣境便是分別之智非無分別也及有為故者夫無分別智智境平等平等不可説有為之異若其智外有所緣則見智是有為境是無為便是分別之智故言及有為故如此緣智者是因法喻如此有分別意識俱生緣境之智於智外有所緣境既是有為分別之智此緣真如智亦有所緣何獨不是有為分別智也二是故經言下引四説證成無分別智無有所緣初經證無所緣真如境第二經證智尚不行故離名言智尚不行顯智非有況諸名字顯境非有境智平等斯之謂矣第三經證如來智非能現觀顯智非能緣菩提此翻名智亦云覺第四經重證所緣義勝諦境非有以真如是所緣故重引經證無也三憶持此下牒以結非文中有二初牒以結非二又彼真如下立量以非初中謂汝若能憶持此四經者不應許此無分別智是能現觀此結智非能緣及緣真如者此結境非所緣二又彼真如下立量以非謂彼真如非真勝義是立宗是所緣故是立因猶如色等是同法喻如色等五塵及法塵少分是所緣故非勝義諦真如亦爾既是所緣何獨得是勝義諦耶上來破其非論主義訖自下第二破其立義文中有三初牒其前計故言又汝所説於勝義上更無勝義二如是等言下述其所立謂如汝於想應師等立若於此勝義真如上空無此定性真如故説名為空諸衣絹下正明對破破中有四一立理以破二如説下引説證破三若言真如下破其救義四具止廣諍下息諍指説就初立理破中有三一舉事責同破汝若謂於勝義上更無勝義即得名為見真理者牧牛人等亦於衣絹等上更不見有重衣絹此牧羊人亦應得名見真理者以所觀空俱無異故二又為下明無病妄遮破又為對治諸惡見故説如是空者謂汝若言勝義上更執有定性勝義名惡見人佛為對治此惡見人説勝義空者此牒其計於勝義上下論主對破謂於勝義上更重見有定性勝義在世曾無此類惡人不應遮彼説勝義空也三又彼下明違比量破又彼真如離有無性非能緣非所緣智證之時平等平等汝今乃執真如為有以為所緣無分別智為能緣但言於真如上更不應重見真如故名真如空便如此執真如為有性道理已為我如前所説無為無有實不起似空華之比量理之所遮訖不應更立也二如説下引説證破文中有四一明如來不見生死及以涅槃涅槃即是真如若使真如是實有性云何如來説同虗妄生死俱言不見二已正了智下辨不見所以由如來已正了知無有顛倒所起煩惱即此無有顛倒所起煩惱本性畢竟無有生之自性説此為涅槃何有可見三如是下説智證之相如是分別智正知涅槃本性畢竟非是正知以智無性故非不正知以假名智故為是義故假名無分別智也亦可無知無不知假名無分別智也四由此聖教下釋經顯離相文中又四一由此聖教應知涅槃真如唯是一切分別永滅無法非實有性二非離下反解顯涅槃無性謂非離無有實性真如轉依為相法身成就此言法身即涅槃也三由得下順解顯法身無性由得觀空真對治道者即無分別智假説為真對治道一切分別下出所治畢竟無性假説為轉依法身如文可解四如契經下引説證成文亦可解三若説真如下破相應師救義文有二初牒其救詞二即外道下廣破所救前中相應師救云經中準言智尚不行況諸名字及此中無法可見等文並以真如離相及離言説故作是語非謂真如畢竟無實而作是説故今論主牒其救詞云若言真如雖離言説而是實有為二即外道下廣破所救中有四一明真如及我名相難異其體無殊汝此真如即與外道所計我其體無異但可名字相心計度差別汝説為真如外道説為我非體有別也二如彼真如下廣辨真如及我二相文中先辨真如相如彼真如雖是實有而就勝義諦中真如之體不可同於色等諸塵有無相等言語心行而分別取故言有非有等分別不成我亦如是下次辨我相文中三一辨我體是其實有周遍法界常住無變既能造作又能受領二而離分別下彰我體離初總標離相故言而離分別釋離相故云以非言語所行等即謂言語道斷心行處滅也故名離分別下總結離相三彼教中下引説證成可解三我相既爾下舉同責異有二句一以同責異二此有何下結同責別初中言我體相既其是有周遍法界常住離相與真如不異故言我相既爾而復説言智緣真能得解脫非智緣我能得解脫此有何別下結同責別文相可解四唯執朋黨下明法同情隔彰已不信謂汝相應師專作朋黨自言智緣真如得解脫緣我不得外道亦爾專作朋黨自言智緣於我能得解脫緣真如不得故我下結已不信謂汝相應師所計真如與外道相似故我不能信受也實有非有者重顯相似相以俱計為有有同執離相故云非有也四且廣諍下息諍止説諸有厭怖下釋言意文相可解復有同類乘劣乘下破第十一執文中有四一序外執二若不開示下論主對破三為不説下外人救義四實有此説下論主釋通前中有二初舉處是同證定有性謂十二處通攝為與無為於有為既有自性故知無為亦定有自性故言十二處攝有為無為定有自性二以有苦等下並能為境生道滅惡證定有性謂此十二處即是四諦境觀四比境生十六行智精勤修習下明緣此四境能滅惑止苦若其無為一同空無有性云何與彼有為同能作境生道滅惡既能生道滅惡故知定有自性文相可解二若不開示下論主對破破中有三初若不能知諸法性空則一切聖人無有捨惡進善之義謂若不開示諸法性空衆生咸謂諸或及苦定性是有性若定有誰當能捨三界諸惑及苦過失諸善功德其性若定誰當能修功德善法而得增進二三乘雖下明若不能知諸法性空三乘聖道應無差別謂既不作法空觀但同作人空觀故聖道不得有差別但可資糧根性勝解差別而已三如是一切下若不能知諸法性空三乘解脫應無差別文中有二初明作人空觀除煩惱障故得二乘解脫文又二初解外人伏難難云我向所引皆是佛説汝論主不信耶二論主答云我皆信受此是佛為欲今人依於世俗名用諦觀道理差別但是伏惑非究竟斷又顯二乘所證人空解脫未見究竟若聖佛乘悉皆失沒故名世俗理依此世俗理説彼二乘道差別非謂勝義法空理差別也二若離下明作法空觀故得佛乘解脫然文反解如文可解若順解應言由佛證入法無我性故能永斷所知障故大師究竟解脫三為不説下明外人救義故云若使上下乘解脫有此差別者經中為不説言二乘解脫及佛解脫無差別耶四實有此下論主釋通文有二初釋外人所引解脫解脫無差別經謂三乘皆同解脫煩惱障義邊故作此説二非一切下釋令所言上下乘解脫差別之意謂經中言三乘同坐解脫床無差別者自據三乘同解脫煩惱障不異故作是説非謂於一切法種別知其自性皆空解脫所知障故作如是説此是法説譬如下喻説二解脫優劣不同譬如毛孔之空與太虗空空性雖同大小非無差別人空解脫望法空解脫亦爾空性雖同淺深非無差別若不爾下反釋佛乘勝於二乘謂若上下乘證空淺深無差別者諸佛應不能發勝果作用及所證應非究竟也且止傍論應辨正論者勸息廣諍此中正論者謂辨諸法性有無傍論者謂明解脫優劣解脫優劣既非正明故勸且止諸法定性明之未訖故應須辨二修觀行下次別破諸外道執文中有二初結前生後二此自性下當計正破前中明修行者悟入自佛法宗所計虗空等空是結前亦當悟入他外道宗所計自性等七種句義皆空是生後也外道諸師計此七種為常故入無為中破二此中下當計正破凡破五執此中自性士夫論者破第一執文中有四第一序外計二今應詰下論主對破三若不失下明外人救義四具應審下論主釋通前中言自性者舊云冥性以苦樂為體即是我所士夫者即是我也此執同僧佉計文中有二初自述己宗言我宗中明三界皆似空華轉變謂空華用自性為體從自性轉變為此空華三界空華轉變三界亦用自性為體空華既以自性為空華便是有體之法故言非無空華二彼是下難破論主同法喻顯論主所立宗不成夫論同喻要須彼此同許我宗既將空華是有論主則無同喻同喻若無所立無為無實之宗亦不成故言由彼是有同喻不成違所立故也二今應詰問下論主對破文中有三初牒其計故云汝言三界皆似空華轉變二如是下兩關審問如是三界為是空華一問為非空華兩問三若言下對前兩問為難若言三界皆是空華牒前初問違害下與之作過汝前立宗云三界皆似空華既言似空華則三界與空華別體今言三界是空華則三界與空華同體將今同言違前別語故言違害自宗空也三界與空華別體在世共知今言三界即是空華故言違害共知也若言三界非是空華牒後問也是則為之作過謂三界既非空華即空華不同三界三界為體是則空華自體定空無故言是則為無也空華既其無性則我所立同喻成就空華無義既成則失汝所立宗華有之本宗也三若言不失下破其救義若言不失者對論主向道其失空華有之本宗故今云不失也空華無聲下釋成不失之義聲者言聲也謂空華無言能遮論主空華無言即復詮同三界有性是則空華性非無論主同喻不成然我不失本宗也此是論主牒外人救義詞訖四且應察下論主釋通通中有二初通其不失之言二又遮詮下釋其空華無聲等語前中又二初兩關審問二若汝謂我下對問立過前云汝為謂我説空華滅無為同法喻是一問為謂我即説空華相為同法喻是第二問二若汝下對問立過先對初問為之立過文可解若説空下對後問為之立過若説空華為同法喻空華世俗之無三界世俗之有不應同三界有故謂彼空華亦同三界是有此言下結呵外人二又遮詮下釋其空華無聲等語其前云我空華無聲能遮論主空華無言即復能詮同三界有性故論主今破云夫遮詮之言但以遮止為勝遮所遮已功能即盡無有功能更表所遮差別汝之空華無聲亦爾遮我空華無言功能已盡云何更有功能詮表所遮空華同三界有性差別如是下指同前釋可解諸數論師下破第二執雖俱是僧佉宗然執計不同是故別破文中有二初明外計二論主破前中文三初明立義方便詞云我雖不能親自現見成立最勝士夫二法體有然就世間共知諸變異聚方便準量而成立彼最勝士夫二體實有也最勝即自性冥性苦樂癡等名之差別也二謂諸下外人立量證有以非論主文中立兩量初約自性為量顯自性是有謂諸顯事有性為因是立宗顯事是有法謂大我執五唯量五體士根此二十法顯現可見故名顯事有性為因此是法謂前顯事各有自性作因也此法及有法不相離名宗有種類故者是立因謂以自性為種類故諸有種類一切皆見有性為因如檀片是同法喻如一斤檀分為多行多片之中香皆如本顯事亦爾雖復變為二十三種類種類之中皆如自性也如是顯事下約士夫作量證士夫是有如是顯事有能受者是立宗顯事即二十三法此是有法有能受者即是我此是法法及有法不相離名宗所受用故此是因謂顯事是士夫所受用也諸所受用下舉同法喻可解三既是所受下結非論主既有所受用顯事即有能受用士夫故知士夫定是實有當知論主前説無為無有實之比量便為我今無為有實敵量之所違害也問歒量相違與因過中相違決定兩邊何別答前宗為後宗相違名違敵量是宗過中能別不極成也二宗所立因各符自宗名為相違決定乃是因過二此就世俗下論主對破破有三一依世俗對破二依勝義對破三結已比量無能違害就前世俗破中復二初明不顯差別許其成量便立已成過去次佛法中亦復有顯事謂蘊界處等有性者謂阿賴耶識中所有種子各各自有體性名為有性能轉變生蘊界處等故言便立已成若立顯事下第二約顯事別破為作兩過一無同喻過二因不成過初若立顯事樂等為因即無同喻者顯事無因喻過汝立一切顯事皆以苦等為因於此宗外更無顯事共佛法同以苦等為因可為同喻也因亦不成者有性之因即苦樂癡是佛法以不可立則是隨一不成故言因亦不成也樂等種類非共許故者釋不成因相若以比量下僧佉立比量救因不成過言若以比量成立因言者謂成立有性因言四蘊皆是苦樂癡性是立宗是蘊性故是立因如受蘊者是同法喻此所説下論主對破為作三過一此所説癡非受蘊攝同喻不成即是喻過喻既有過則所立不成以癡是行蘊收故二又汝士夫下破士夫實有量又汝士夫多體相遍有積聚義由此士夫因成不定空者汝蘊性故因望苦等宗有同品遍轉望士夫不用苦等為性即是異品遍轉故有不定過也以其立士夫一一衆生各各有一士夫遍法界衆生身則是有積聚義故得名蘊然士夫不苦樂等為性顯事即以苦樂等為性士夫顯事一一衆生各各皆有並牙相遍未知蘊性故因為如士夫遍法界故不用苦等為性為如顯事遍法界故用苦等為性故言因成不定三又汝下破外人救義又汝樂等各別無能一一立宗是蘊性故因義不成者其前用受蘊為同法喻論主前破癡非受蘊攝同喻不成其今救云諸是蘊者皆用或苦或樂以為體性猶如受蘊苦樂一一別説為受蘊體然僧佉宗苦樂癡三法必不相離方始功能具足若一一離張則無功能故言汝樂等各別無能夫論蘊者積聚為義汝若苦樂一一別説為受蘊者既不積聚則蘊義不成故言因義不成也舉同法喻本欲成因同喻不成故因亦不成也上來就世俗諦以破外難二若就勝義下就勝義諦以破外難若就勝義有實檀片有性為因非共許故同喻不成同喻檀斥用有性作同法喻佛法不許故同喻不成也又就世俗下第二破士夫比量文中有二初依世俗諦破二就勝義諦破就世俗破中初總破士夫上難謂若總相立諸顯事有能受者不辨差別是世所共知立已成過以世所共知能受之者有故二若立顯事下對二宗差別説實有受者周遍常住思為自性則無同喻過如是下顯同喻不成相若就勝義下則同喻不成五不成中當俱不成以佛法中無有我故當其自宗於勝義中更無有我可為同喻即所立不成飲食水有性故能立不成前説比量下對其前云論主前説比量便為敵量佛違宗故令結云前説比量無有敵量能為違害結已無過如我來破汝實有汝量汝難能立不成汝皆有過則我上云無為無有實不起似空華之量無有敵量能為違害也諸勝論師下次破第三執文中有二初勝論立量二此就世俗下論主對破前中始從入息乃至根變等相是有法定有所相是法即是我也既有入出息等能相之相故智定有所相我也此二是宗是能相故是立因謂入出息是能相也如見煙等是同法喻火是所相故煙為能相二此就世俗下論主破破中初正破次時方下類破就正破中初約世俗立有所相便成二過一立已成過文可解二若立彼相下無同喻過言違所立者謂違所立士夫神我也二若就勝義下亦有無同法喻過二時方空下次明類破諸勝論師下破第四執文中有三初言極微與意我立無為是述自宗二成立空因不起故者自不成因者道論主初成立無為無為空不起故因於論主有自不成因過即是隨一不成以論主宗中不許極微與意是不起法也若謂此二下次破論主成立有為有為空緣生故因於他有不成因過以勝論宗將極微與意同是無為不從緣生故以緣生故因於彼勝論有不成因過也亦是隨一不成應成少分下總結非二因明論主不起故因及緣生故因於自於他隨一不成故云應成少分悟入性空也二若言極微下論主對破破中有三初反舉可其難詞謂意極微若依世俗亦是無為可有此緣生故因於他有不成因難二然所立意下順釋非其難文中有二初破意是無為然所立意且非無為是立宗智生因故是立因猶如色等是同法喻如是句下舉能作因差別皆是無常證意定非無為也言同異性者謂有同性故有異性故二破極微是無為中有二初約能成因量以破又諸極微亦非無為是立宗能成因故是立因猶如縷等是同法喻如是下舉能作因差別皆是無常證極微非定無為也謂有合故有離故有有數故有同故有異故二或二極微下約極微是所成因量以破初云或二微所成粗物非常為因是立宗論主語外人言此二極微體是無常非常住極微為因同生粗微是所成故是立因謂二合能為因獨一不能即是假他一微所成也猶如瓶等是同法喻如是下舉從因所生差別皆是無常證極微非是無為由此下結非外説成已無過如上所説下第五舉上例下類破倮形外道等執故言無衣論亦隨所應當立為空上來別明依聞思所成慧悟入無為性空如是遣除下第三總結勸益自謂佛法他謂外道上來至此明無為中大段第一依聞思所成慧正比量力悟入無為性空雖聞所成智下第二依修所成慧悟入無為性空準前悟入有為中別明修慧悟入此亦應然今此中略標而已更不廣辨有為者下第二雙明悟入為無為空之修慧與此不異所以不更具明也若對初卷悟入有為性空此卷上來第二悟入無為性空此下第三雙辨有為無為性空觀此論文勢地前唯有有漏修慧位判是聞思位以未斷惑故初地已上是修慧位已斷惑故就此文中有二初結前生後故云雖聞所成智階梯力已入性空等也言階梯力者以地前未能亡相除惑見法有性故聞慧假比量力漸次示其諸法性空由藉聞思曉示知法性空後令觀入修慧正證諸法空理然證法性空由聞思慧力故名聞思等慧以為階梯闕勝修力未能永斷所應除障地前未得修慧但能伏惑故云未能永斷所應除障者言所應除障者即謂煩惱所知二障就煩惱障中又有二種一是見惑此惑要初地證知方滅也若是修惑初地已上但伏上心不斷種子至金剛心方始頓斷其種子若是所知障地地別斷當地障種初地斷見惑得人空又斷所知障得法性空故悟諸法性相皆空也故又精勤習勝修力者正明生後勸習修慧也第二若於此中隨有一種下正明修慧就明修慧中大分為七第一明淨障之智對障顯體第二證得無動無現下明前淨障之智依定方能除惑第三相應論者下明對異宗説智不同勸物取捨第四如是等執既滅除已下明修起勝修之智行相方法第五由此理教審觀察下勸依行相理教修起於智第六修觀行者以是慧行無分別下牒智果相勸未證者依之修學第七如是妙見所攝受下明修智利益就前第一初地已上淨障之智對障顯體中又有二分第一明於有為無為境上離有無等四謗相障此明不見所緣之境既能如是遠離二邊下明於能知為無為境是無之想想即智也此能緣無之想亦滅此明不見能緣之智也此中雖寄斷四障以顯無分別慧非謂前後四時滅此四障也明無分別慧正起之時於境智平等不見能緣所緣有無等相若見境智不同有無等異便是其不可得顯無分別慧故廣辨四障之過令人識知非謂前後四時各斷四障後得無分別慧也就第一滅有相障而顯智中文則有三一先舉有相障文言若於此中者謂於此初地中也言隨有一種為無為相有間無間復現行時者此正出障體然障有二種一是人執二是法執初當入地時已入見道斷於人執然計諸法有性等即是法執於二執中前已斷人今但斷法故云隨有一種於為無為計有定相相即體也起執之時或不相續及相續故言有間無間對前已斷人執人執既除法執復起故言復現行時也理而言之當入地則二執俱斷今據説時為此先後也二即應如理觀彼性空遣除彼相令不顯現者對障舉智顯智能滅障謂即應如理觀彼為無為性相體空遣除有相之執令不現起故言令不顯現三悟入諸法離自性故其性本空下明障滅智顯得其三益初明得開涅槃門益謂三解脫門二不離性故下得趣涅槃門益謂七種無相行文并易解三由此行相下明證涅槃益謂惑滅即是無為無為即涅槃已此中總辨非謂地地別論也言令無所行行相者謂正證如之時於為無為境無所行相於智無能行相境智平等平等今為遣障故偏言令無所行行相也文部初法説言遣除粗相者此中滅有相障對下滅無相等障説此為粗也二如眩醫下喻説可解雖於此部下第二明滅無相障顯於智文部有三一先舉無相障言雖於此部已得無住者謂雖於此有為無為有相法部已得於相無所住之行不執有相然由空等分別現行有功用心猶相續住未得無動了知空等分別現行障礙出世無分別慧者謂觀境無相雖能破於有相之境然此計無相境若其作無相分別現行此無相心既是有功用心猶相續住復成空障而此空障亦能障於無動無分別慧若未得無動無分別慧無由了知空等分別現行能為障礙障礙無分別慧也第二為欲棄捨下對障舉智顯智能滅障為欲棄捨者明修智之意謂為欲棄捨無相之障故須觀諸法亦有亦無而棄捨之然修對治不可悠悠故云勇猛正勤如是觀察言如是觀察者就勝義諦中空性之境亦非實有此是立宗言等者取有及亦有亦無非有非無等也謂於勝義諦部無此四執也從緣生故者是立因猶如幻等是同法喻幻等從緣生既非實有空等四執之境亦從緣生何得實有此中第三應明利益利益不異於前故不説之下二亦爾第三如是勤修下滅亦有亦無障文中有三第一先舉亦有亦無相障言如是勤修復能除遣空等分別者謂我前依勝義諦如是勤修復能除遣空亦有亦無等分別境相之鄣也初為有病勤修空滅有病雖遣空復成病然斷定之病不可偏取有除以有先已是病為是義故於有空病雙更須勤修亦有亦無而遣空病空病雖滅而亦有亦無復更成病然此亦有亦無之病若不勤修勝義諦觀無由除遣故今云如是勤修勝義諦觀不但能除空病亦復能除亦有亦無分別之病也空即空病等者等取亦有亦無及非有非無病也第二除遣彼故下對障舉智顯智能滅障除遣彼故者謂除遣彼有無及亦有亦無病故空不空等二邊遠離終不更以空等行相觀察諸法者言二邊者謂亦有亦無二邊此則明智能滅障不起也第三如説下別説證成也初約五蘊作八對無相觀前四對是八修門後三是三空門第八總結觀相如色蘊為觀既受等四蘊亦爾後例十二處六度三十七品八定六通十力四無畏四無礙十八不共法三摩地陀羅尼門一切智謂於此等諸法門上患不觀為常乃至不觀非遠離故言乃至廣説文皆可解第四既能如是遠離二邊下滅非有非無相障文中有三第一先舉非有非無境相之障既能如是遠離二邊謂亦有亦無離二邊即能生長處中妙行者謂為前有亦有亦無相障故非有耶非無相來滅此非有非無之相對前亦有亦無相障是邊是粗故説今非有非無為中為妙第二此離二邊下對障舉智顯智能滅障言此離二邊處中道理由如上説二種此量有為無為者謂此遠離二邊中道妙行道理於能滅非有非無障復是是治然於有為無為境上仍見有非有非無之不稱勝義諦理由是知我上依勝義諦理説二種比量云真性有為空如幻緣生故無為無有實不起似空花良以勝義諦理離此四諦非證勝義智無以能滅故舉前比量意顯證智為此障治也良由依證起説是以舉説顯證也色類無故下廣辨處中妙行之相謂於為無為色類等法無色無示無住無現無了別無幖幟等六行但證勝義諦時境智平等何有行相可得今舉妙行有想意顯勝無相也解此六無相文即為六文可解第三如世尊下引説證成六無相行上來至此明證無分別勝修智時於為無為等一切境上不取有相無相亦有亦無相非有非無相謂能滅取境四謗之障也此則明無分別智不見所緣境自下第二既能如是下明於能知為無為境是無之想亦無此明不見能緣之智此則境智平等無能緣所緣故是無分別智也所謂聖智非無宗無宗者無相虗心非無契契之者無心此則內外兩冥緣觀俱寂斯之謂矣就此文中有四謂將欲入證此無分別智之時一須識障二須識治三由識障障便止息四識治故便能入證就前第一須識障中障有二種一是所取境之相分必須了知能障無分別慧前已明離故云既能如是遠離二實有四而云二者但此四邊本唯有無令就本以説故云二邊二是能遣四無見分説名為想今云無二想者對上所緣境之相分就本説二今明能遣見分之想亦就本説二也故云於能安住無二想上起分別無二之相亦能了知是障無分別慧上來明識相見二障訖寂靜安住者此一句明能識治若見有所取境相及能取之智則分別紛動無由能息故須寂靜境智安住平等方證境智不二無分別慧也三如是説因下對前識障故障便止息言如所説因速能永斷者如向所説見有境智即此境智是分別之因因既永除則分別語言及分別意言並皆止息也四證得下對前識治便能入證故云證得無動無現無相離諸戲論諸法實性於其所緣無動證入自相妙知相續安住此之十句辨無分別智證之相初五説相後五釋成言證得無動者謂於其所緣證得無相故不為相分所動言無現者謂無分別智正證入時無有能證之智見分顯現也言無相者謂無分別智正證之時證勝義諦理無二自相非證總相也即無有所證之境相分也言離諸戲論者諸無分別智是真實妙智遠離一切戲論分別也諸法實性者謂無分別智止證諸法實性之時相續安住境智平等無所取捨也上來廣辨證得無分別智勝修慧訖雖勤修習下第二明無分別智所依定但斷惑之智必須依定方能除惑故説智後次説所依定也文中有二初明即智所依定二如世尊言下引説證成就初中言雖勤修習無倒空觀此辨智次觀證為相此即觀無所觀而於空性終不作證者空以無觀證為相此即止無所止此之定慧二數一念同時説二無二相不同餘分別定慧雖復同時二數而有二相也如是名為勝義靜慮者結明此定是真實勝定也如世尊言雖修靜慮下引説證成謂不依五陰十二處身心四大等其文可解相應論師下第三明對異宗説智不同勸物取捨文中有二第一序異宗謂大乘中瑜伽論者所説無分別智云有定執言一切所取能取分別悉皆遠離是出世間無分別智即於其中起堅實相精動修習者謂正證無分別智之時遠離所取相分及能所見分説此能離二分之慧名無分別智即於此能忘所取能取之慧執為真實無分別智相而精勤修習問若無分別智不取相分者應當識外別有法為分別智所緣則一切法皆是唯識之義不成瑜伽師義説答言緣即識真如故成唯識非識外別有法為所緣也第二有餘於此下説之對破破中有二初通破智境二復審察言下唯破智體前中又三初立比量通破智境二如契經下引説為證三由此理教下結破定執前立量中又二初立二量以破智境二舉二量因次破智境須非最勝初立量云如是智生雖無如上所説分別者是立宗言如是智生者是分無別智生也此是有法雖無如上所説分別者謂雖無如上所説所取能取相見二分分別而言有識體真如為智所緣此是法法及有法名宗而隨無相境相起故自性分別所隨遂故是有為故此三並是立因而隨無相境相起故者汝雖言離所取能取相見二分分別而計有無分別智隨無二分相境相而起有能緣智及所緣無相真境豈離分別而言無分別智也自性分別所隨遂故者此無分別智若依初靜慮及未至中間必為尋伺數所隨遂故言自性分別所隨遂亦現量智名自性分別汝無分別智雖非比量分別智而有現量分別智所隨遂亦可分別真如為自性境即為彼能分別真如自性之智所隨遂此即以用隨體也是有為故者汝此無分別智既計為能緣真如無相為所緣俱是唯識故是有為也如餘現量有分別覺不成出世無分別智聞法喻如餘現量有分別覺存於智境不成出世無分別智汝今所言亦存智境何獨得是分別智第二比量又彼所計離相離言真如勝義是立宗是所緣故是立因如餘所緣不成勝義是同法喻如餘五識所緣五塵境及定境一念識正取塵之時此塵亦離相離言既不成真義何獨今此所緣獨成真如勝義二即由此因俱非最勝者謂即由向二量諸因證彼相應師所説無分別非最勝也如契經下第二引經為證初經證勝義諦能緣智後經證無境可經由此理教下第三結破定行由此二比量所立理及所引二經教彼相應師於證無分別智勝義諦中應斷於此所計有能緣智及所緣真如境之定執也復審察下第二唯破智體文中有二初立比破其所説無分別智亦非實有是立謂我今復更就勝義諦中如汝如是説有能緣所緣境智出世分別智此智於勝義諦中亦非實有也從緣生故是因猶如幻士是同法喻餘文可解二若智能斷下破其所説無分別智能斷諸惑謂若説無分別智能斷於惑如是定執智能斷惑此能執智亦如彼所斷之惑何故有過失故謂有執者之過失故我今不復能開示過失也若立比量開示過失應云無分別智不能惑立宗從緣生故是立因如餘分別之智亦可猶如幻是同法喻準前可知故不開示也第四如是等執既滅除無下明修起勝修無分別慧行相方法文中有三初明知相二修觀行者下明智行成滿為佛所記三如是慧行名聖默然下明無分別慧別名不同前中又二初正明行解二如世尊下引經為證前中又二初結除前過故言如是執既除滅已二於所應智下立量辨行言於所應知境性亦無行解是立宗謂境無性相智無行解緣闕故者是立因謂境龍生於行解是行解因緣今應知境既無性相能緣行解何緣得生故言因緣闕故也餘智不生由無行解是同法喻如餘取塵之智一有前塵三有同時受等數法以為行解三既有受等行解智俱生以同是數法故若無所緣塵則無行離行解既無則智不生也今無分別智亦爾境無性相則行解不解既其不起智何由生三是故名為真實行解者色等謂境離性相非所取行解不行無能取此雖則無行解而行解究然雖行解宛然而無行解故得名為真行解也二如世尊言下引經為證文中有五初經明行解二經明現觀三經明見諦四經重明現觀文中有五初問二答三難四通五因論生論五真行解下通會三口名別義一也第二修觀行者下明智行成滿為佛中有三初明知行成滿二若能如是下明為佛所説三經下引經為證文皆可解第三如是慧行名聖默然下明無分別智名別不同文中有二初明如是無分別慧行名聖默然二如契經下引經釋成文中復三初明諸佛説法必如實開示所證之法二復於是法下正辨證如是觀時下釋默然名文皆可解第五由此理教下勸依行相理教修起無分別智文中有三初明依理教審知境智無性證此明慧能除晴障二説頌標宗三長行廣辨初中有三初勸以依行解理教詳審觀察故言由是理教審觀察時二一切有為下明由依行理教審觀則知一切為無為法無有能為心慧境性三如是知已下明若能於心境平等是則雖無明慧而明宛然雖明慧宛然而無明慧故一切愚暗得無所有説為除也二説頌標宗文亦有二上半頌前心境平半頌後無分別慧能除愚暗上半中初句明一切相下句明諸佛菩薩智人能正了知悉皆無性所以無見也初言心者謂一切漏無漏心慧者一切漏無漏慧者謂一切空有等法是心慧境界現者謂心慧所變相分顯現為心慧所緣諸者若心若慧若境若現其類非是故云諸智者即佛菩薩證無分別智故名智者由者因緣也無分別智藉心慧境現而作因緣證法性捨相所以稱由不取者謂於心等四法知其性空相無執無見所以不取也言慧行無分別無所行而行者所言慧者即無分別智行者智無所生行説名為行分別者於似無影像無相無言心境無所分別名無分別言無所行者遊履名行無分別智無所遊履名無所行雖無所行而無所不行故名為行此則無所行而行宛然行宛然而無所行也第三長行中次第廣解初解心中能集諸行種子或為諸行種子所集故名為心中者謂此初句頌中也能集諸行種子者謂阿賴耶識聚集無始世來新舊有為諸行種子是故若心此則是種種義滋長義以解心也或為諸行種子所集故者謂一切有為諸行等法皆為此阿賴耶識中種子之起是故名心此則集起以解心也次解慧字言能持勝德或由彼持令不流散故名為慧者謂五度諸勝依持般若為般若開導方始得起故能持勝般若復由彼五度勝德資持方得成滿故言或由彼持令不流散故名為慧次解境字文中有二初正解境如契經下引經證境無相就解境中初總對心慧次解境言心惠所行名心慧境境地所行是名差別者謂境即是地蓋是心慧所行地名差別是故名字境也二別口心慧以解境然此中約有相以解心境約無性以解心偏據有漏心慧偏據無漏慧此是影論也心慧未口口離為存略故作此影也如契經言無相分別慧終不轉者引説證境無相顯慧無行轉即行也次解現字現謂顯現正解現字即似心慧下出現體相謂依心慧境界而心慧各變為相分自緣故名現也釋劫解諸字約五十二處五蘊三十七品六波羅蜜六通十力四無畏十八不共法諸三摩地陀羅尼門四向四果及一切智智此等諸法別皆是心慧境非一故名為諸次解智者可解次解説捨相因緣者謂無分別智藉心慧境而作因緣説諸法性而生平等捨相所以稱由次解不取謂無分別智心慧境無執無執無見名為不取解上半訖由不取下解下半頌文中初藉前為問因者是心慧境此之智境是等捨相不取之因故今牒之為問達心慧境性相平而生捨相不執不取為何所證也即舉頌答云慧分別無所行而行文中先解慧行無分別且止謗解無所行而行前中有三初釋頌文二非非所見下破非顯是三又諸法性皆非能見下辨是異非前中釋慧字次釋元分別字後釋行字就慧字中先體故言慧者即無分別知雖復永離一切分別覺增益假名為智此釋慧名謂無分別智既永離一切分別覺慧增益應不名慧何為名慧耶故復永離一切分別覺慧增益實不可名慧然覺慧而覺慧宛然雖覺慧宛然而無覺慧故是無覺慧覺慧如是無覺覺慧不知何以名之強為立名名智也次釋無分別文中有二初正釋無分別名似無影像無相無言境界起相自性分別亦無有故名無別者言似無影像者如瑜伽師云無分別離相見等所取能取分別然智不緣無仍緣真如為境名似無影像此似無影像無有十相無相言語道斷名曰無言心行滅處名境界起相亦無有謂其如不作境起心相分為心所緣真如亦非自性分別境故言亦無有無有之言通上境界起無有所以言亦故名無分別者謂無分別智不緣如相真如故名無分別也分別者謂無分別無有所以言亦故名無智不緣如此離相言雖無住者下釋分別難者云無分別住絶一切相本無能住誰説無分別故今釋云於無分別勝義諦別位絶一切相無住者不可宣説分別有無而就世俗異中假名建立名無分別也如言燈滅阿羅漢滅者舉類顯相如燈滅位處及羅漢滅位處豈可得存滅名耶但約覺慧增益依世俗言説相續異位中假滅名此亦如是就分別異位中假立尼分別名分別智名有分別者重復舉類可解中意取下後行行字此中謂今説行教中意所智於無生境行説名為行非據正證時有此行由此智行自他法性一切種相平等平等非有所見故不名能見即非能見説真見也此即非能見能見非能見也如所證故者此行見亦如所證非能見也此則顯證行平等也非非所見下第二破非顯是中又有二初徵瑜伽師真如為非所見二又智有為下明智與真如為無見應成不平等見前中又三初以三過徵責二諸可見下立量以責三真如若是可見下雙以見非見義徵責初三過中初句以見顛倒責文云非二所見所見相或有分別或無分別真見得成者初言非者謂汝豈非以真如非是所見作所見相汝如此見使成顛倒真見豈得成也此見與境乖則虗妄不實以分別有無不定故言或有分別或無分別也二真如是下以見違宗責真如若是所見性者汝宗之中不應為非可見性三雖依世俗下以見不平等責若依勝義真如本無能見所見雖依世俗假説有平等見望勝義便非平等故是不平等見也二諸可見者下立量以責諸可見者皆非真實是立宗起解因故是立因如陽焰水是同法喻一切可見皆非真實是可見亦非真實三真如若是下雙以見非見義徵責真如若是可見性者以可見相取便名為見不成真見也真如若是非可見性不應説言見真如也若見非可見此見便是顛倒之見豈得名為平等見也二又智有為下明智是有為真如無為性不平等若爾此智之見應成不平等何故汝宗説為三又諸法性皆非能見下辨是異非是文中有三初以解第三就勝義以釋前中初云又諸法性皆能見見亦應爾亦非能見何以故俱以無生為自性故生既同何得一為能見一非能見如境者二種即皆非能見故是平等今依世俗假名説智為見境為非見故口所説依無生理非不平等就第二中有三句初立正義云又一剎那中證一切法皆無現觀何以故境智皆無生故但隨世俗假名真現觀二不應難下如刀不自割指不自觸云何一剎那智能返口不照自云何一剎那證一切法故云不應難言返照自體難成立故謂智應不證智之實性也三二種俱非釋難顯真謂境智二種俱非可見境性亦非能見性何以故以同無生性無著別故所以同一剎那時亦於自體俱證也三若就勝義下就勝義以釋文中有二初正就勝義以釋二如契經下引説為證初云就勝義似境相及似智相本生故智無現觀境證得二如契經下引説為證可解且止謗論下釋四句頌文中有三初云且止傍論者經前生後名非論頌文為傍正論頌文為正二遊履下正釋頌文初寄於行以辨無行故云遊履名行無遊履故名無所行是無行解下正解無行義以一切法皆無行解智亦是同無解以皆是無生起性義故故無是行不行不行行也二寄對無行以辨於分別慧以不行相而為行相故即無所行説名為行謂無分別慧性是無生所以無有行相隨世俗故假名説行也此即不行行行不行也故即下結説所以也三此略説下結無分別智是正勤行果第六修觀行者下牒下智行相勸未證者依之修學文中有二約牒述向前慧行定相故云如是慧行無分別故不行而行不行慧行無生所以不行雖不行未嘗不行言行雖復言行而行無自性故言不行也二遠離下相示物文中有二初明智非能行次離作意於法無住心如虗空捨離分別如入滅定以觀諸法是以不而行即不行故言遠離一切乃至觀諸法性二諸佛法身下明境非所見以佛法身不可了別無相無見無起相無影超過覺慧雖如是觀而不見即不見故諸佛法身乃至見境體無生所以不見雖復不見未嘗不見故言而見雖復言見而境無自性故言不見也前明無能行之智後明無所見之境若爾豈同木石哉斯蓋至人以無之妙慧契彼無相之虗境此則內外兩填緣觀俱寂豈容境智於其間哉第七如是妙見所攝受下明修智利益文中有三初指前妙能攝受勝利故云是妙見所攝受故二能正增下出所攝受益文二初明得自利益二能滅他苦下明利他益前自利益中又二初明得樂益二清淨一味下明除障益就得樂益中又二初明起因益能正增長無量福聚此明起益能感無邊微妙樂果明成果益清淨一味者是第二除障益謂無分別智正證之時於一切法平等平等故言味二他苦下明利他益如是正觀下明分別是衆行之首而能通道生一切此智既證則萬行俱起文中有二初明修智既證八行斯成二如是正觀下明修智既證六行受立初明智證行成二如是正觀下指經廣説勸物生信以觀諸法同一無生不見法性有無之相則能捨離斷常耶見故名正見證法平等遍計永息耶思不生名正惟由證無生尋問行戲語一切永息名為語法平等無有起作離身三種耶業名為以證一切無增減性知命無生離耶悕望名為正命以證諸法無作無起離耶進求名正精進以證法性絶於有無離耶妄念名為正念以證諸法無所取離耶依住名為正定下指説可解如是正觀下明修智既證六行受立文中有三初結前生後文言雖行而事者謂於一念無分別智正具六行非謂別修加行方起故言而有是事也施以棄財離慳為義智證之時捨有行棄惑亦復如是戒以止惡自思守為義智證之時息緣無得亦復如是忍以息恚起慈為義智證之證法無生不忍於生亦復如是證法無生瞋恚不起不忍於生無緣慈立精進以不怠進求為義智證之時平等平等不取勝行不捨亦復如是靜慮以住心為義智之時無能所住亦復如是般以息耶分別遠離愚癡為義智證之時分別智不所以戲論不起一切境平等所以遠離二相二此義下指所説處可解第三如是妙住下總嘆無分別智導萬行勸物修學文雖近嘆無分別智而遠包一部勸物流通也言如是妙住有無量門者無分別智捨者據勝義諦無妙不妙但隨妙不妙也所言住者智證平等等復對誰以説於住此則非住而強名為住即住住不住也然此妙住之智正證之時隨義而説有無量法門無量菩薩藏經中佛處處廣廣説證智時有大義利也謂證大涅槃名為大義證大菩提名為大利以菩提通智具足三身能利自他故此即以非義利為義利勸物修學釋可解
